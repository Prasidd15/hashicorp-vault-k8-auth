apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-secret-rotator
  namespace: finance
  labels:
    purpose: vault-token-rotation
    managed-by: infra-team
spec:
  schedule: "0 * * * *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 600
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: vault-token-rotator
          containers:
            - name: rotator
              image: alpine/k8s:1.27.3
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  NAMESPACE="finance"
                  SECRET="vault-auth-finance-token"
                  SA_NAME="vault-auth-finance"
                  echo "[$(date)] Starting secret rotation..."
                  kubectl delete secret ${SECRET} -n ${NAMESPACE}
                  echo "[$(date)] Old secret deleted"
                  cat <<YAML | kubectl apply -f -
                  apiVersion: v1
                  kind: Secret
                  metadata:
                    name: ${SECRET}
                    namespace: ${NAMESPACE}
                    annotations:
                      kubernetes.io/service-account.name: ${SA_NAME}
                      rotated-at: "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                  type: kubernetes.io/service-account-token
                  YAML
                  for i in $(seq 1 12); do
                    TOKEN=$(kubectl get secret ${SECRET} \
                      -n ${NAMESPACE} \
                      -o jsonpath='{.data.token}' 2>/dev/null || echo "")
                    if [ -n "$TOKEN" ]; then
                      echo "[$(date)] Token populated after ${i}x5s"
                      break
                    fi
                    if [ "$i" = "12" ]; then
                      echo "[$(date)] ERROR: Token never populated"
                      exit 1
                    fi
                    sleep 5
                  done
                  echo "[$(date)] Rotation complete"
              resources:
                requests:
                  cpu: "50m"
                  memory: "32Mi"
                limits:
                  cpu: "100m"
                  memory: "64Mi"
              volumeMounts:
                - name: kube-api-access
                  mountPath: /var/run/secrets/kubernetes.io/serviceaccount
                  readOnly: true
          volumes:
            - name: kube-api-access
              projected:
                sources:
                  - serviceAccountToken:
                      path: token
                      expirationSeconds: 3607
                  - configMap:
                      name: kube-root-ca.crt
                      items:
                        - key: ca.crt
                          path: ca.crt
